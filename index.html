document.getElementById("t").innerText="🎵 Sonando "+(i+1)+" de "+lista.length+": "+lista[i];
au.src=encodeURI(lista[i]);
au.play();
}
function empezar(){ tocar(); }
function siguiente(){ i++; if(i>=lista.length){ i=0; } tocar(); }

<!DOCTYPE html><img src="file_00000000c268820e905223dfda1d8e2a.png">
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Online Melodi PY</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:10px}
.logo{width:90%;max-width:350px;border-radius:20px;margin-top:10px}
h1{color:#FFD700;margin:5px}
h3{color:#ff2222;margin:0 0 10px}
#player{width:95%;margin:10px 0}
.boton-grande{background:#FFD700;color:#000;border:none;padding:16px;margin:8px;border-radius:20px;font-size:20px;font-weight:bold;width:95%;cursor:pointer}
.cancion{background:#1a1a1a;border:2px solid #FFD700;color:#fff;padding:14px;margin:8px;border-radius:15px;font-size:17px;width:95%;text-align:left;cursor:pointer}
.activa{background:#FFD700 !important;color:#000 !important}
</style>
</head>
<body>

<img src="icon.png" class="logo">
<h1>RADIO ONLINE MELODI PY</h1>
<h3>★ 24 HS - Con buenas Música ★</h3>

<audio id="player" controls controlsList="nodownload"></audio>
<p id="sonando" style="color:#FFD700;font-weight:bold">Apretá abajo para que suene sin parar 👇</p>

<button class="boton-grande" onclick="sonarTodo()">▶️ SONAR TODO SIN PARAR - REPITE SOLO</button>
<button class="boton-grande" style="background:#ff2222;color:#fff" onclick="sonarAleatorio()">🔀 SONAR EN ALEATORIO</button>

<div id="lista"></div>

<script>
const canciones = [
"Aseguimita mante aiko - Derlis Gerardo y la misma.mp3",
"Aunque Sea A Escondidas(MP3_160K).mp3",
"Azteka_ Amiga Mia.mp3",
"Bajo Los Ojos De Dios(MP3_160K).mp3",
"Bronco - Amor Total (1989)(MP3_160K).mp3",
"Bronco - Espinas (1992)(MP3_160K).mp3",
"Bronco - Oro (1991)(MP3_160K).mp3",
"Bronco - Un Fin De Semana (1989)(MP3_160K).mp3",
"Che yvoty suavemi - Derlis Gerardo y la misma.mp3",
"Grupo Azteka-Quien.mp3",
"Llorando Los Dos(MP3_160K).mp3",
"Mi complice - rolo y los impecables.mpg(MP3_160K).mp3",
"Olv\u00eddate De Todo(MP3_160K).mp3",
"Quien sabe el tiempo la nde jeju - Derlis Gerardo y la misma(MP3_mp3K).mp3",
"ROLO Y LOS IMPECABLES - TE BUSCO TANTO HERMANO.mpg(MP3_160K).mp3",
"Te Amo Y Te Amo(MP3_160K).mp3",
"ka_avo tory - Derlis Gerardo y la misma.mp3",
"prometiste rolo y los impecables(MP3_160K).mp3",
"Grupo Bryndis - Amor Sincero.mp3",
"Grupo Bryndis - Aunque Tenga Que Llorar.mp3",
"Grupo Bryndis - Como Olvidar.mp3",
"Grupo Bryndis - Deja Que.mp3",
"Grupo Bryndis - El Idioma Del Amor.mp3",
"Ipohyi ne pore \u00b4y - Julio Cesar y los magicos de amor.mp3",
"Ko \u00b4anga la ndavy \u00b4ai - Julio Cesar y los magicos de amor(MP3_mp3K).mp3",
"Ndaiporichene nde mbojojaha - Julio Cesar y los magicos de amor(MP3_mp3.mp3",
"Ndarekoveima consuelo - Julio Cesar y los magicos de amor(MP3_mp3K).mp3"
];

const lista = document.getElementById("lista");
const player = document.getElementById("player");
const sonando = document.getElementById("sonando");
let actual = 0;
let aleatorio = false;

function bonito(n){ return n.replace(".mp3","").replace("(MP3_160K)","").replace("(MP3_mp3K)","").replace("(MP3_mp3",""); }

function tocar(i){
  actual = i;
  player.src = encodeURI(canciones[i]);
  player.play().catch(()=>{});
  sonando.innerText = "🔊 Sonando ahora: " + bonito(canciones[i]);
  document.querySelectorAll(".cancion").forEach((b,idx)=>{ if(idx===i) b.classList.add("activa"); else b.classList.remove("activa"); });
}

function siguiente(){
  if(aleatorio){ tocar(Math.floor(Math.random()*canciones.length)); }
  else { let s = actual + 1; if(s >= canciones.length) s = 0; tocar(s); }
}

function sonarTodo(){ aleatorio = false; tocar(0); }
function sonarAleatorio(){ aleatorio = true; tocar(Math.floor(Math.random()*canciones.length)); }

player.onended = siguiente;
player.onerror = () => { siguiente(); };

canciones.forEach((nombre,i) => {
  let btn = document.createElement("button");
  btn.className = "cancion";
  btn.innerHTML = "▶️ " + bonito(nombre);
  btn.onclick = () => { aleatorio = false; tocar(i); };
  lista.appendChild(btn);
});
</script>

</body>
</html>

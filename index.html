<div style="text-align:center;">
<button onclick="empezar()" style="padding:15px;width:95%;background:#ffcc00;font-size:18px;font-weight:bold;border-radius:12px;">▶️ PLAY SIN PARAR 🔁</button>
<p id="t" style="color:white;">Apretá PLAY</p>
<audio id="a" controls style="width:95%;"></audio>
</div>
<script>
let lista=[], i=0;
let au=document.getElementById("a");
async function empezar(){
let r=await fetch("https://api.github.com/repos/MelodiRadio2026/MelodiRadio2026.github.io/contents/");
let d=await r.json();
lista=d.filter(x=>x.name.toLowerCase().endsWith(".mp3")).map(x=>x.name).sort();
tocar();
}
function tocar(){
document.getElementById("t").innerText="🎵 Sonando "+(i+1)+" de "+lista.length;
au.src=encodeURI(lista[i]);
au.play();
}
function siguiente(){ i++; if(i>=lista.length){ i=0; } tocar(); }
au.onended=siguiente;
au.onerror=siguiente;
</script>

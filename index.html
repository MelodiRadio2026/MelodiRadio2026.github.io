<h2 style="color:yellow; text-align:center;">🔥 TODOS JUNTOS</h2>
<div style="text-align:center;">
  <button onclick="playTodo()" style="padding:15px; width:95%; background:#ffcc00; font-size:18px; font-weight:bold; border-radius:12px;">▶️ PLAY TODO JUNTO - SIN PARAR</button>
  <p id="ahoraSuena" style="color:white; font-size:16px;">Apretá PLAY para empezar</p>
  <audio id="playerTodo" controls style="width:95%;"></audio>
  <br>
  <label style="color:white;"><input type="checkbox" id="repetirTodo" checked> 🔁 Repetir todo cuando termine</label>
</div>

<script>
var todo = [
{t:"CACHACAS 80 90 - DJ TEIO", f:"CACHACAS%20REMIX%20DE%20LOS%2080%2090%20INOLVIDABLES%20X%20DJ%20TEIO%202023%28MP3_160K%29.mp3"},
{t:"ENGANCHADOS CACHACAS MIX", f:"ENGANCHADOS%20CACHACAS%20MIX%28MP3_160K%29.mp3"},
{t:"DJ REY AYALA MIX 8", f:"dj%20rey%20Ayala%20mix%208%20.enganchado%20-mix8.mp3"},
{t:"MI AMOR", f:"Mi%20Amor%28MP3_160K%29.mp3"},
{t:"ESE LOCO SOY YO", f:"Ese%20Loco%20Soy%20Yo%28MP3_160K%29.mp3"},
{t:"LLORANDO LOS DOS", f:"Llorando%20Los%20Dos%28MP3_160K%29.mp3"},
{t:"OLVIDATE DE TODO", f:"Olvidate%20De%20Todo%28MP3_160K%29.mp3"},
{t:"OSITO DORMILON", f:"Osito%20Dormil%C3%B3n%28MP3_160K%29.mp3"},
{t:"AZTEKA - AMIGA MIA", f:"Azteka_%20Amiga%20Mia.mp3"},
{t:"GRUPO AZTEKA - QUIEN", f:"Grupo%20Azteka-Quien.mp3"},
{t:"BRONCO - ORO", f:"Bronco%20-%20Oro%20%281991%29%28MP3_160K%29.mp3"},
{t:"BRONCO - ESPINAS", f:"Bronco%20-%20Espinas%20%281992%29%28MP3_160K%29.mp3"},
{t:"BRONCO - AMOR TOTAL", f:"Bronco%20-%20Amor%20Total%20%281991%29%28MP3_160K%29.mp3"},
{t:"TE AMO Y TE AMO", f:"Te%20Amo%20Y%20Te%20Amo%28MP3_160K%29.mp3"},
{t:"LA ROMPE CORAZONES", f:"La%20Rompe%20Corazones%28MP3_160K%29.mp3"},
{t:"BAD BUNNY MIX EXITOS", f:"Bad%20Bunny%20Mix%20Exitos%202.mp3"},
{t:"LOS DEL FUEGO - JURABA", f:"Los%20del%20Fuego%20-%20Juraba.mp3"},
{t:"SUDAMERIKAL", f:"Sudamerikal%28MP3_160K%29.mp3"}
];
var pos = 0;
var pTodo = document.getElementById("playerTodo");
function playTodo(){
  pTodo.src = todo[pos].f;
  document.getElementById("ahoraSuena").innerHTML = "🎵 Sonando: " + todo[pos].t;
  pTodo.play();
}
pTodo.onended = function(){
  pos = pos + 1;
  if(pos >= todo.length){
    if(document.getElementById("repetirTodo").checked){ pos = 0; }
    else { return; }
  }
  playTodo();
};
</script>
<!-- FIN TODOS JUNTOS -->
